<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>料金シミュレーター｜Happy sugar Business Solutions</title><meta name="description" content="業務アプリ・公式LINE・事務作業自動化の料金をかんたんシミュレーション。"><style>:root{font-family:system-ui,'Noto Sans JP',sans-serif;color:#253044;background:#f7f8fc}*{box-sizing:border-box}body{margin:0}.wrap{max-width:820px;margin:auto;padding:32px 16px 70px}header{text-align:center;margin-bottom:28px}.brand{color:#b34779;font-weight:800}h1{font-size:clamp(25px,5vw,38px)}p{line-height:1.7;color:#667286}.panel{background:#fff;border:1px solid #e5e8f0;border-radius:18px;padding:22px;margin:16px 0;box-shadow:0 6px 24px #24304a0b}h2{font-size:19px}.choices{display:grid;gap:10px}.choice{border:2px solid #e5e8f0;border-radius:13px;padding:16px;cursor:pointer;background:#fff}.choice.active{border-color:#c95187;background:#fff6fa}.choice strong{display:block}.choice small{display:block;margin-top:6px;color:#667286}.price{color:#a13c6b;font-weight:800;margin-top:8px}.summary{background:#253044;color:white;border-radius:16px;padding:22px}.summary p{color:#d6dce8}.totals{display:grid;grid-template-columns:1fr 1fr;gap:16px}.big{font-size:clamp(24px,5vw,33px);font-weight:800}.muted{font-size:12px;color:#cbd5e3}.btn{border:0;background:#c95187;color:white;border-radius:10px;padding:14px 18px;font-weight:700;cursor:pointer;width:100%;margin-top:12px}.note{font-size:12px;color:#667286}.overlay{position:fixed;inset:0;background:#172238ad;display:none;align-items:center;justify-content:center;padding:12px;z-index:5}.overlay.open{display:flex}.modal{background:#fff;width:min(100%,650px);max-height:94dvh;display:flex;flex-direction:column;border-radius:18px;overflow:hidden}.modalhead,.modalfoot{padding:16px 20px;border-bottom:1px solid #eee}.modalhead{display:flex;justify-content:space-between;align-items:center}.modalhead button{font-size:26px;border:0;background:transparent;cursor:pointer}.modalbody{padding:16px 20px;overflow-y:auto}.feature{line-height:1.9;color:#536075}.opt{display:flex;justify-content:space-between;gap:12px;border:1px solid #e5e8f0;border-radius:10px;padding:12px;margin:8px 0}.opt input{accent-color:#c95187}.opt span{font-size:14px}.opt b{white-space:nowrap;font-size:13px}.mode{padding:12px;border:1px solid #ddd;border-radius:10px;margin:8px 0;display:block}.support{padding:10px;background:#f8f8fc;border-radius:10px}.modalfoot{border-top:1px solid #eee;border-bottom:0}.back{display:inline-block;margin-bottom:15px;color:#a13c6b} @media(max-width:520px){.panel{padding:16px}.totals{gap:10px}.modalhead,.modalbody,.modalfoot{padding:14px}}</style></head><body><main class="wrap"><a class="back" href="/">← ホームページへ戻る</a><header><div class="brand">Happy sugar Business Solutions</div><h1>あなたに合った料金をチェック</h1><p>やりたいことを選ぶだけで、目安の料金がわかります。</p></header><section class="panel"><h2>STEP 1｜何を便利にしたいですか？</h2><div id="products" class="choices"></div></section><section class="panel"><h2>概算のお見積もり</h2><div class="summary"><strong id="productName"></strong><div class="totals" style="margin-top:16px"><div><div class="muted">初期費用（税込）</div><div class="big" id="initial"></div></div><div><div class="muted">月額（税込）</div><div class="big" id="monthly"></div></div></div><p id="summaryDetails"></p></div><button class="btn" id="consult" style="background:#278465">この見積もり内容で無料相談する</button><button class="btn" id="copy">見積もり内容をコピー</button><p class="note">※表示は概算・最低価格です。個別見積もり項目や外部サービス費用は含みません。正式な金額は仕様確認後に決定します。</p></section></main><div class="overlay" id="overlay"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="modalhead"><strong id="modalTitle"></strong><button id="modalClose" aria-label="閉じる">×</button></div><div class="modalbody" id="modalBody"></div><div class="modalfoot"><strong id="modalPrice"></strong><button class="btn" id="modalDone">この内容で決定して閉じる</button></div></div></div><script>const products=[{"id":"startup","name":"🌱 創業応援 がんばれプラン","base":0,"monthly":11000,"features":["売上・経費入力","月別収支集計","グラフ表示","データ出力","PC・スマホ対応"],"options":[],"note":"初期費用0円、最低6か月。カスタマイズは別途見積もり。"},{"id":"app","name":"💻 見やすい業務管理アプリ","base":55000,"features":["管理データ1種類","画面2つ","一覧・検索・追加・編集・削除","PC・スマホ対応"],"options":[["管理画面追加",16500],["データ種類追加",22000],["入力フォーム追加",16500],["権限設定",33000],["既存データ取込",11000],["写真・書類管理",33000]]},{"id":"line","name":"💬 公式LINE活用","base":33000,"features":["初期設定","リッチメニュー6項目まで","デザイン・リンク設定","あいさつメッセージ"],"options":[["リッチメニュー7〜12項目",33000],["受付フォーム・スプシ自動記録",33000],["予約受付・管理",55000],["独自ポイントカード制作",55000],["ポイントカードとLINE連携",33000],["複雑な特典・ポイントルール（個別見積もり）",0],["高度な自動応答・通知",22000]],"note":"拡張機能はLINE側の設定・認証・審査等が必要になる場合があります。"},{"id":"auto","name":"⚡ 事務作業の自動化","base":33000,"features":["自動処理1つ","管理表1つ","実行条件1種類","初期設定・動作確認"],"options":[["自動処理追加",22000],["メール通知",16500],["Chatwork通知",16500],["請求書・見積書の自動作成",33000],["外部サービス連携（可否確認）",55000],["AI書類読取・入力候補",55000]]},{"id":"enterprise","name":"🏢 会社まるごと業務改善","base":165000,"features":["複数業務の一元管理","PC・スマホ対応","画面・機能・修正範囲を事前確定"],"options":[],"note":"買い切り165,000円〜、または月110,000円〜（最低6か月）。月額契約でも初期開発費は事前に別途確定。"}];const yen=n=>n.toLocaleString('ja-JP')+'円';let selected='startup';const selections={};let mode='buy';let support='none';const $=id=>document.getElementById(id);function active(){return products.find(p=>p.id===selected)}function opts(){return selections[selected]||[]}function calc(){const p=active(),enterprise=p.id==='enterprise',sub=enterprise&&mode==='monthly';const extras=opts().reduce((n,i)=>n+p.options[i][1],0);return{initial:sub?null:p.base+extras,monthly:(sub?110000:p.monthly||0)+(support==='basic'?5500:support==='plus'?11000:0),sub}}function render(){const p=active(),c=calc();$('productName').textContent=p.name;$('initial').textContent=c.initial===null?'別途見積もり':yen(c.initial)+(p.id==='startup'?'':'〜');$('monthly').textContent=yen(c.monthly)+(c.sub?'〜':'');$('summaryDetails').textContent='追加機能：'+(opts().map(i=>p.options[i][0]).join('、')||'なし')+' ／ 保守：'+({none:'なし',basic:'安心サポート',plus:'しっかりサポート'}[support]);document.querySelectorAll('.choice').forEach(el=>el.classList.toggle('active',el.dataset.id===selected))}function openModal(){const p=active();$('modalTitle').textContent=p.name;let html='<h4>基本内容</h4><ul class="feature">'+p.features.map(x=>'<li>'+x+'</li>').join('')+'</ul>';if(p.id==='enterprise')html+='<h4>ご契約方法</h4><label class="mode"><input type="radio" name="mode" value="buy" '+(mode==='buy'?'checked':'')+'> 買い切り：165,000円〜</label><label class="mode"><input type="radio" name="mode" value="monthly" '+(mode==='monthly'?'checked':'')+'> 月額：110,000円〜 ＋ 初期開発費（別途事前見積もり）</label>';if(p.options.length)html+='<h4>追加オプション</h4>'+p.options.map((o,i)=>'<label class="opt"><span><input type="checkbox" data-option="'+i+'" '+(opts().includes(i)?'checked':'')+'> '+o[0]+'</span><b>'+(o[1]?'+ '+yen(o[1])+'〜':'個別見積もり')+'</b></label>').join('');if(!['startup','enterprise'].includes(p.id))html+='<h4>保守サポート（任意）</h4><div class="support">'+[['none','なし',0],['basic','安心サポート',5500],['plus','しっかりサポート',11000]].map(x=>'<label class="mode"><input type="radio" name="support" value="'+x[0]+'" '+(support===x[0]?'checked':'')+'> '+x[1]+(x[2]?' 月'+yen(x[2]):'')+'</label>').join('')+'</div>';if(p.note)html+='<p class="note">'+p.note+'</p>';$('modalBody').innerHTML=html;$('overlay').classList.add('open');$('modalBody').querySelectorAll('input').forEach(input=>input.addEventListener('change',()=>{if(input.dataset.option!==undefined){const i=Number(input.dataset.option);const s=new Set(opts());input.checked?s.add(i):s.delete(i);selections[selected]=[...s]}else if(input.name==='mode')mode=input.value;else if(input.name==='support')support=input.value;render();modalPrice()}));modalPrice()}function modalPrice(){const c=calc();$('modalPrice').textContent='初期費用 '+(c.initial===null?'別途見積もり':yen(c.initial))+' ／ 月額 '+yen(c.monthly)}function closeModal(){$('overlay').classList.remove('open')}products.forEach(p=>{const el=document.createElement('div');el.className='choice';el.dataset.id=p.id;el.tabIndex=0;el.innerHTML='<strong>'+p.name+'</strong><small>'+p.features.slice(0,2).join('・')+'</small><div class="price">'+(p.id==='enterprise'?'買い切り165,000円〜／月110,000円〜':p.base?'制作'+yen(p.base)+'〜':'月'+yen(p.monthly))+'</div>';el.onclick=()=>{selected=p.id;support='none';render();openModal()};el.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();el.click()}};$('products').appendChild(el)});$('modalClose').onclick=$('modalDone').onclick=closeModal;$('overlay').onclick=e=>{if(e.target===$('overlay'))closeModal()};document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});function estimateText(){const p=active(),c=calc();return 'Happy sugar 概算見積もり\n商品：'+p.name+(c.sub?'（月額契約）':'')+'\n初期費用：'+(c.initial===null?'別途お見積もり':yen(c.initial)+(p.id==='startup'?'':'〜'))+'\n月額：'+yen(c.monthly)+(c.sub?'〜':'')+'\n追加機能：'+(opts().map(i=>p.options[i][0]).join('、')||'なし')+'\n保守：'+({none:'なし',basic:'安心サポート',plus:'しっかりサポート'}[support])+'\n※正式な金額は仕様確認後に確定します。'}$('consult').onclick=()=>{const u=new URL('https://consult.happysugar.online/');u.searchParams.set('src','estimate');u.searchParams.set('estimate',estimateText());location.href=u.toString()};$('copy').onclick=async()=>{try{await navigator.clipboard.writeText(estimateText());$('copy').textContent='コピーしました！';setTimeout(()=>$('copy').textContent='見積もり内容をコピー',1600)}catch(e){alert(estimateText())}};render();</script></body></html>
